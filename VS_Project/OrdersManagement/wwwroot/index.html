<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f7f6f3;
      --surface:   #ffffff;
      --border:    #e4e2dc;
      --border-md: #d0cdc5;
      --text:      #1a1916;
      --text-2:    #6b6860;
      --text-3:    #a09d98;
      --accent:    #0d7c66;
      --accent-lt: #e6f4f1;
      --accent-dk: #095c4c;
      --warn:      #c45c1a;
      --warn-lt:   #fdf0e8;
      --danger:    #b83232;
      --danger-lt: #fdeaea;
      --info:      #1e6fa8;
      --info-lt:   #e8f3fc;
      --radius:    8px;
      --radius-lg: 14px;
      --shadow:    0 1px 3px rgba(0,0,0,.07), 0 4px 12px rgba(0,0,0,.05);
      --shadow-lg: 0 4px 6px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.10);
    }

    html { font-size: 15px; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── HEADER ─────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .header-inner {
      max-width: 1200px; margin: 0 auto;
      padding: 0 2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
    }
    .logo {
      display: flex; align-items: center; gap: .625rem;
    }
    .logo-mark {
      width: 30px; height: 30px; border-radius: 7px;
      background: var(--accent);
      display: grid; place-items: center;
    }
    .logo-mark svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .logo-text { font-size: .95rem; font-weight: 600; letter-spacing: -.02em; }
    .logo-text span { color: var(--accent); }

    .header-right { display: flex; align-items: center; gap: 1rem; }
    #connection-status {
      display: flex; align-items: center; gap: .4rem;
      font-size: .78rem; color: var(--text-2);
      font-family: 'DM Mono', monospace;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-3); }
    .dot.online  { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-lt); }
    .dot.offline { background: var(--danger); }

    /* ── LAYOUT ─────────────────────────────────────────────────── */
    main { max-width: 1200px; margin: 0 auto; padding: 2rem; }

    /* ── STATS ROW ──────────────────────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem; margin-bottom: 2rem;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 1.25rem 1.5rem;
      box-shadow: var(--shadow);
      animation: fadeUp .4s ease both;
    }
    .stat-card:nth-child(2) { animation-delay: .05s; }
    .stat-card:nth-child(3) { animation-delay: .10s; }
    .stat-card:nth-child(4) { animation-delay: .15s; }
    .stat-label { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); font-weight: 500; margin-bottom: .4rem; }
    .stat-value { font-size: 2rem; font-weight: 600; letter-spacing: -.04em; line-height: 1; }
    .stat-value.accent  { color: var(--accent); }
    .stat-value.warn    { color: var(--warn); }
    .stat-value.info    { color: var(--info); }
    .stat-value.neutral { color: var(--text); }

    /* ── TWO COLUMN ─────────────────────────────────────────────── */
    .content { display: grid; grid-template-columns: 1fr 360px; gap: 1.5rem; align-items: start; }

    /* ── PANEL ──────────────────────────────────────────────────── */
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow);
      animation: fadeUp .4s .15s ease both;
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    .panel-title { font-size: .95rem; font-weight: 600; letter-spacing: -.01em; }
    .panel-body { padding: 1.5rem; }

    /* ── FILTER BAR ─────────────────────────────────────────────── */
    .filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; }
    .filter-btn {
      padding: .3rem .85rem; border-radius: 99px;
      border: 1px solid var(--border); background: transparent;
      font-family: inherit; font-size: .8rem; cursor: pointer;
      color: var(--text-2); transition: all .15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff; font-weight: 500;
    }

    /* ── TABLE ──────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .875rem; }
    thead th {
      text-align: left; padding: .875rem 1rem;
      font-size: .72rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--text-3); font-weight: 500; white-space: nowrap;
      border-bottom: 1px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
      animation: fadeIn .25s ease both;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }
    td { padding: .875rem 1rem; vertical-align: middle; }
    .td-id { font-family: 'DM Mono', monospace; font-size: .78rem; color: var(--text-3); }
    .td-name { font-weight: 500; }
    .td-sub  { font-size: .78rem; color: var(--text-2); margin-top: .1rem; }
    .td-money { font-family: 'DM Mono', monospace; font-size: .85rem; }
    .td-money .total { font-weight: 500; }
    .td-money .unit  { font-size: .75rem; color: var(--text-3); }

    /* ── BADGE ──────────────────────────────────────────────────── */
    .badge {
      display: inline-flex; align-items: center; gap: .3rem;
      padding: .2rem .65rem; border-radius: 99px;
      font-size: .72rem; font-weight: 500; white-space: nowrap;
    }
    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; }
    .badge-pending    { background: #fef9e8; color: #9a6f00; }
    .badge-inprogress { background: var(--info-lt); color: var(--info); }
    .badge-completed  { background: var(--accent-lt); color: var(--accent-dk); }
    .badge-cancelled  { background: #f5f4f2; color: var(--text-3); }

    /* ── ROW ACTIONS ────────────────────────────────────────────── */
    .actions { display: flex; gap: .4rem; }
    .btn-icon {
      width: 30px; height: 30px; border-radius: var(--radius);
      border: 1px solid var(--border); background: transparent;
      display: grid; place-items: center; cursor: pointer;
      transition: all .15s; color: var(--text-2);
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
    .btn-icon.danger:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-lt); }
    .btn-icon svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ── EMPTY STATE ────────────────────────────────────────────── */
    .empty {
      text-align: center; padding: 4rem 2rem;
      color: var(--text-3); font-size: .875rem;
    }
    .empty svg { width: 40px; height: 40px; margin: 0 auto 1rem; opacity: .3; display: block; }

    /* ── FORM PANEL ─────────────────────────────────────────────── */
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: .78rem; font-weight: 500; color: var(--text-2); margin-bottom: .35rem; letter-spacing: .01em; }
    input, select {
      width: 100%; padding: .6rem .85rem;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text);
      font-family: inherit; font-size: .875rem;
      transition: border-color .15s, box-shadow .15s; outline: none;
    }
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-lt);
      background: var(--surface);
    }
    input::placeholder { color: var(--text-3); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    /* ── BUTTONS ────────────────────────────────────────────────── */
    .btn {
      width: 100%; padding: .65rem 1rem; border-radius: var(--radius);
      border: none; font-family: inherit; font-size: .875rem;
      font-weight: 500; cursor: pointer; transition: all .15s;
      display: flex; align-items: center; justify-content: center; gap: .4rem;
    }
    .btn-primary {
      background: var(--accent); color: #fff;
    }
    .btn-primary:hover { background: var(--accent-dk); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(13,124,102,.3); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── TOAST ──────────────────────────────────────────────────── */
    #toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; display: flex; flex-direction: column; gap: .5rem; }
    .toast {
      padding: .75rem 1.1rem; border-radius: var(--radius);
      font-size: .83rem; font-weight: 500; box-shadow: var(--shadow-lg);
      animation: slideIn .25s ease; max-width: 320px;
      display: flex; align-items: center; gap: .5rem;
    }
    .toast.success { background: var(--accent); color: #fff; }
    .toast.error   { background: var(--danger); color: #fff; }
    .toast.out     { animation: slideOut .25s ease forwards; }

    /* ── MODAL ──────────────────────────────────────────────────── */
    .modal-overlay {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(26,25,22,.45); backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface); border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg); width: 360px; padding: 1.75rem;
      animation: popIn .2s ease;
    }
    .modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; }
    .modal-actions { display: flex; gap: .6rem; margin-top: 1.25rem; }
    .btn-secondary {
      flex: 1; padding: .6rem; border-radius: var(--radius);
      border: 1px solid var(--border); background: transparent;
      font-family: inherit; font-size: .875rem; cursor: pointer;
      transition: background .15s;
    }
    .btn-secondary:hover { background: var(--bg); }
    .btn-danger {
      flex: 1; padding: .6rem; border-radius: var(--radius);
      border: none; background: var(--danger); color: #fff;
      font-family: inherit; font-size: .875rem; font-weight: 500; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-danger:hover { opacity: .85; }

    /* ── LOADING ─────────────────────────────────────────────────── */
    .spinner {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      animation: spin .6s linear infinite;
      display: none;
    }

    /* ── ANIMATIONS ─────────────────────────────────────────────── */
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideOut{ to   { opacity: 0; transform: translateX(20px); } }
    @keyframes popIn   { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin    { to   { transform: rotate(360deg); } }

    /* ── RESPONSIVE ─────────────────────────────────────────────── */
    @media (max-width: 900px) {
      .stats   { grid-template-columns: repeat(2, 1fr); }
      .content { grid-template-columns: 1fr; }
    }
    @media (max-width: 500px) {
      .stats { grid-template-columns: 1fr 1fr; }
      main { padding: 1rem; }
      .header-inner { padding: 0 1rem; }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <span class="logo-text">Order<span>MS</span></span>
    </div>
    <div class="header-right">
      <div id="connection-status">
        <span class="dot" id="status-dot"></span>
        <span id="status-text">connecting…</span>
      </div>
    </div>
  </div>
</header>

<!-- MAIN -->
<main>

  <!-- STATS -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Orders</div>
      <div class="stat-value neutral" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Pending</div>
      <div class="stat-value warn" id="stat-pending">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">In Progress</div>
      <div class="stat-value info" id="stat-inprogress">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Completed</div>
      <div class="stat-value accent" id="stat-completed">—</div>
    </div>
  </div>

  <div class="content">

    <!-- ORDER TABLE -->
    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Orders</span>
        <div class="filter-bar">
          <button class="filter-btn active" data-status="">All</button>
          <button class="filter-btn" data-status="Pending">Pending</button>
          <button class="filter-btn" data-status="InProgress">In Progress</button>
          <button class="filter-btn" data-status="Completed">Completed</button>
          <button class="filter-btn" data-status="Cancelled">Cancelled</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Customer / Product</th>
              <th>Qty</th>
              <th>Price</th>
              <th>Status</th>
              <th>Date</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="order-tbody">
            <tr><td colspan="7"><div class="empty">Loading…</div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div style="display:flex;flex-direction:column;gap:1.5rem;">

      <!-- CREATE FORM -->
      <div class="panel" style="animation-delay:.2s">
        <div class="panel-header">
          <span class="panel-title">New Order</span>
        </div>
        <div class="panel-body">
          <form id="create-form" novalidate>
            <div class="form-group">
              <label>Customer Name</label>
              <input type="text" id="f-customer" placeholder="Customer" required />
            </div>
            <div class="form-group">
              <label>Product Name</label>
              <input type="text" id="f-product" placeholder="Product" required />
            </div>
            <div class="form-row">
              <div class="form-group" style="margin-bottom:0">
                <label>Quantity</label>
                <input type="number" id="f-qty" placeholder="1" min="1" required />
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label>Unit Price (₹)</label>
                <input type="number" id="f-price" placeholder="0.00" min="0.01" step="0.01" required />
              </div>
            </div>
            <div style="margin-top:1.25rem">
              <button type="submit" class="btn btn-primary" id="submit-btn">
                <div class="spinner" id="submit-spinner"></div>
                <span id="submit-label">Create Order</span>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- UPDATE STATUS FORM -->
      <div class="panel" style="animation-delay:.25s">
        <div class="panel-header">
          <span class="panel-title">Update Status</span>
        </div>
        <div class="panel-body">
          <div class="form-group">
            <label>Order ID</label>
            <input type="number" id="u-id" placeholder="e.g. 3" min="1" />
          </div>
          <div class="form-group">
            <label>New Status</label>
            <select id="u-status">
              <option value="Pending">Pending</option>
              <option value="InProgress">In Progress</option>
              <option value="Completed">Completed</option>
              <option value="Cancelled">Cancelled</option>
            </select>
          </div>
          <button class="btn btn-primary" id="update-btn" style="background:#1e6fa8">
            <span>Update Status</span>
          </button>
        </div>
      </div>

    </div>
  </div>
</main>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="delete-modal">
  <div class="modal">
    <h3>Delete Order #<span id="modal-order-id"></span>?</h3>
    <p style="font-size:.875rem;color:var(--text-2)">This will permanently remove the order. Only pending orders can be deleted.</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="modal-cancel">Cancel</button>
      <button class="btn-danger" id="modal-confirm">Delete</button>
    </div>
  </div>
</div>

<!-- TOAST CONTAINER -->
<div id="toast-container"></div>

<script>
  // ── CONFIG ─────────────────────────────────────────────────────
  const API = '/api/orders';   // relative — works with any host

  // ── STATE ──────────────────────────────────────────────────────
  let orders       = [];
  let activeFilter = '';
  let deleteTarget = null;

  // ── UTILS ──────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const fmt = n  => '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtDate = s => new Date(s).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'2-digit' });

  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    $('toast-container').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3000);
  }

  function setStatus(online) {
    $('status-dot').className  = 'dot ' + (online ? 'online' : 'offline');
    $('status-text').textContent = online ? 'API connected' : 'API unreachable';
  }

  // ── API CALLS ──────────────────────────────────────────────────
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      headers: { 'Content-Type': 'application/json' },
      ...opts
    });
    const body = res.status === 204 ? null : await res.json().catch(() => null);
    if (!res.ok) throw new Error(body?.message || `HTTP ${res.status}`);
    return body;
  }

  async function loadOrders() {
    try {
      const url = activeFilter ? `${API}?status=${activeFilter}` : API;
      orders = await api(url);
      setStatus(true);
      renderTable();
      updateStats();
    } catch (e) {
      setStatus(false);
      $('order-tbody').innerHTML = `<tr><td colspan="7"><div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Could not reach the API. Is the server running?</div></td></tr>`;
    }
  }

  // ── STATS ──────────────────────────────────────────────────────
  async function updateStats() {
    try {
      const all = await api(API);
      const count = s => all.filter(o => o.status === s).length;
      $('stat-total').textContent     = all.length;
      $('stat-pending').textContent   = count('Pending');
      $('stat-inprogress').textContent= count('InProgress');
      $('stat-completed').textContent = count('Completed');
    } catch {}
  }

  // ── RENDER TABLE ───────────────────────────────────────────────
  function badgeClass(s) {
    return { Pending:'badge-pending', InProgress:'badge-inprogress', Completed:'badge-completed', Cancelled:'badge-cancelled' }[s] || '';
  }
  function badgeLabel(s) {
    return { Pending:'Pending', InProgress:'In Progress', Completed:'Completed', Cancelled:'Cancelled' }[s] || s;
  }

  function renderTable() {
    if (!orders.length) {
      $('order-tbody').innerHTML = `<tr><td colspan="7"><div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h4"/></svg>
        No orders found.</div></td></tr>`;
      return;
    }
    $('order-tbody').innerHTML = orders.map(o => `
      <tr>
        <td class="td-id">#${o.id}</td>
        <td>
          <div class="td-name">${esc(o.customerName)}</div>
          <div class="td-sub">${esc(o.productName)}</div>
        </td>
        <td>${o.quantity}</td>
        <td class="td-money">
          <div class="total">${fmt(o.totalPrice)}</div>
          <div class="unit">${fmt(o.unitPrice)} × ${o.quantity}</div>
        </td>
        <td><span class="badge ${badgeClass(o.status)}">${badgeLabel(o.status)}</span></td>
        <td style="font-size:.78rem;color:var(--text-3)">${fmtDate(o.createdAt)}</td>
        <td>
          <div class="actions">
            <button class="btn-icon" title="Set In Progress" onclick="quickStatus(${o.id},'InProgress')">
              <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            </button>
            <button class="btn-icon danger" title="Delete" onclick="confirmDelete(${o.id})">
              <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
            </button>
          </div>
        </td>
      </tr>`).join('');
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── QUICK STATUS ────────────────────────────────────────────────
  async function quickStatus(id, status) {
    try {
      await api(`${API}/${id}/status`, { method:'PATCH', body: JSON.stringify({ status }) });
      toast(`Order #${id} → ${status}`);
      loadOrders();
    } catch (e) { toast(e.message, 'error'); }
  }

  // ── DELETE ──────────────────────────────────────────────────────
  function confirmDelete(id) {
    deleteTarget = id;
    $('modal-order-id').textContent = id;
    $('delete-modal').classList.add('open');
  }
  $('modal-cancel').onclick  = () => $('delete-modal').classList.remove('open');
  $('modal-confirm').onclick = async () => {
    try {
      await api(`${API}/${deleteTarget}`, { method:'DELETE' });
      toast(`Order #${deleteTarget} deleted`);
    } catch(e) { toast(e.message, 'error'); }
    $('delete-modal').classList.remove('open');
    loadOrders();
  };
  $('delete-modal').onclick = e => { if (e.target === $('delete-modal')) $('delete-modal').classList.remove('open'); };

  // ── FILTER ─────────────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.status;
      loadOrders();
    };
  });

  // ── CREATE FORM ────────────────────────────────────────────────
  $('create-form').onsubmit = async e => {
    e.preventDefault();
    const customer  = $('f-customer').value.trim();
    const product   = $('f-product').value.trim();
    const quantity  = parseInt($('f-qty').value);
    const unitPrice = parseFloat($('f-price').value);

    if (!customer || !product || !quantity || !unitPrice) {
      toast('Please fill in all fields.', 'error'); return;
    }

    $('submit-spinner').style.display = 'block';
    $('submit-label').textContent = 'Creating…';
    $('submit-btn').disabled = true;

    try {
      const order = await api(API, {
        method: 'POST',
        body: JSON.stringify({ customerName: customer, productName: product, quantity, unitPrice })
      });
      toast(`Order #${order.id} created!`);
      $('create-form').reset();
      loadOrders();
    } catch(e) { toast(e.message, 'error'); }

    $('submit-spinner').style.display = 'none';
    $('submit-label').textContent = 'Create Order';
    $('submit-btn').disabled = false;
  };

  // ── UPDATE STATUS ───────────────────────────────────────────────
  $('update-btn').onclick = async () => {
    const id     = parseInt($('u-id').value);
    const status = $('u-status').value;
    if (!id) { toast('Enter an order ID.', 'error'); return; }
    try {
      await api(`${API}/${id}/status`, { method:'PATCH', body: JSON.stringify({ status }) });
      toast(`Order #${id} updated to ${badgeLabel(status)}`);
      loadOrders();
    } catch(e) { toast(e.message, 'error'); }
  };

  // ── INIT ───────────────────────────────────────────────────────
  loadOrders();
  setInterval(loadOrders, 30000); // auto-refresh every 30s
</script>
</body>
</html>
