name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore VS_Project/OrdersManagement.sln

      - name: Build
        run: dotnet build VS_Project/OrdersManagement.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test VS_Project/OrdersManagement.Tests/OrdersManagement.Tests.csproj --no-build --configuration Release --verbosity normal

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy
        if: ${{ vars.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl -X POST "${{ vars.RENDER_DEPLOY_HOOK_URL }}"
